[package]
name = "zplc"
version = "0.20.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
capnp = "0.25.0"
chrono = "0.4.39"
clap = { version = "4.5.23", features = ["derive"] }
colored = "3.0.0"
hex = "0.4.3"
nix = { version = "0.30.1", features = ["hostname"] }
openssl = "0.10.70"
prost = "0.13.4"
ring = "0.17.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.8"
toml = "0.9.7"
url = "2.5.8"
zpr = { git = "https://github.com/mkolehmainen/zl-zpr-common.git", tag = "v0.29.0", features = ["policy"] }

